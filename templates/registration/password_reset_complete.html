<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Contraseña actualizada | Sistema de Auditoría</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;

            font-family:
                Inter,
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                Roboto,
                Arial,
                sans-serif;

            background:
                radial-gradient(
                    circle at top right,
                    #243b64 0%,
                    #101827 38%,
                    #080d16 100%
                );

            color: #e8edf5;

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 24px;
        }

        .page {
            width: 100%;
            max-width: 440px;
        }

        .brand {
            text-align: center;
            margin-bottom: 28px;
        }

        .brand-icon {
            width: 58px;
            height: 58px;

            margin: 0 auto 16px;

            border-radius: 16px;

            display: flex;
            align-items: center;
            justify-content: center;

            background: linear-gradient(
                135deg,
                #3b82f6,
                #2563eb
            );

            box-shadow:
                0 12px 30px rgba(37, 99, 235, .30);
        }

        .brand-icon svg {
            width: 30px;
            height: 30px;

            fill: none;
            stroke: white;
            stroke-width: 2;
        }

        .brand-title {
            font-size: 20px;
            font-weight: 650;
        }

        .brand-subtitle {
            margin-top: 5px;

            font-size: 13px;
            color: #8d9aae;
        }

        .card {
            background: rgba(17, 25, 39, .92);

            border: 1px solid rgba(255,255,255,.08);

            border-radius: 18px;

            padding: 38px 34px;

            text-align: center;

            box-shadow:
                0 25px 70px rgba(0,0,0,.40),
                inset 0 1px 0 rgba(255,255,255,.03);

            backdrop-filter: blur(12px);
        }

        .success-icon {
            width: 72px;
            height: 72px;

            margin: 0 auto 24px;

            border-radius: 50%;

            display: flex;
            align-items: center;
            justify-content: center;

            background: rgba(34, 197, 94, .12);

            border: 1px solid rgba(34, 197, 94, .25);
        }

        .success-icon svg {
            width: 36px;
            height: 36px;

            fill: none;

            stroke: #4ade80;

            stroke-width: 2.2;

            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .card h1 {
            font-size: 25px;

            font-weight: 650;

            letter-spacing: -.5px;

            margin-bottom: 12px;
        }

        .description {
            color: #98a6b9;

            font-size: 14px;

            line-height: 1.7;

            margin-bottom: 28px;
        }

        .login-button {
            display: flex;

            align-items: center;
            justify-content: center;

            width: 100%;
            height: 46px;

            border-radius: 10px;

            background: linear-gradient(
                135deg,
                #3b82f6,
                #2563eb
            );

            color: white;

            text-decoration: none;

            font-size: 14px;

            font-weight: 650;

            box-shadow:
                0 8px 20px rgba(37,99,235,.25);

            transition:
                transform .15s ease,
                box-shadow .15s ease,
                filter .15s ease;
        }

        .login-button:hover {
            filter: brightness(1.08);

            transform: translateY(-1px);

            box-shadow:
                0 12px 26px rgba(37,99,235,.35);
        }

        .footer {
            text-align: center;

            margin-top: 24px;

            font-size: 11px;

            color: #526174;
        }

        @media (max-width: 480px) {

            body {
                padding: 16px;
            }

            .card {
                padding: 30px 22px;
            }

            .card h1 {
                font-size: 22px;
            }
        }
    </style>
</head>

<body>

<div class="page">

    <div class="brand">

        <div class="brand-icon">

            <svg viewBox="0 0 24 24">
                <path d="M7 10V7a5 5 0 0 1 10 0v3"/>
                <rect x="4" y="10" width="16" height="11" rx="2"/>
                <path d="M12 14v3"/>
            </svg>

        </div>

        <div class="brand-title">
            Sistema de Auditoría
        </div>

        <div class="brand-subtitle">
            Gestión y control institucional
        </div>

    </div>


    <div class="card">

        <div class="success-icon">

            <svg viewBox="0 0 24 24">
                <path d="M5 12.5l4 4L19 7"/>
            </svg>

        </div>


        <h1>
            Contraseña actualizada
        </h1>


        <p class="description">
            Tu contraseña se cambió correctamente.
            Ya puedes iniciar sesión utilizando tu nueva contraseña.
        </p>


        <a
            href="/admin/login/"
            class="login-button"
        >
            Iniciar sesión
        </a>

    </div>


    <div class="footer">
        Sistema de Auditoría · Acceso seguro
    </div>

</div>

</body>
</html>
