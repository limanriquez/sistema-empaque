{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Contraseña actualizada | Empaque Triple</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --verde: #78A943;
            --verde-oscuro: #5d8732;
            --texto: #273323;
            --texto-secundario: #687563;
        }

        body {
            min-height: 100vh;
            font-family: Inter, -apple-system, BlinkMacSystemFont,
                "Segoe UI", Roboto, Arial, sans-serif;

            background:
                linear-gradient(
                    rgba(22, 39, 18, 0.40),
                    rgba(22, 39, 18, 0.57)
                ),
                url("{% static 'img/huerta-empaque.png' %}");

            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;

            color: var(--texto);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }

        .page {
            width: 100%;
            max-width: 460px;
        }

        .brand {
            text-align: center;
            margin-bottom: 26px;
            color: #fff;
            text-shadow: 0 2px 8px rgba(0, 0, 0, 0.35);
        }

        .brand-icon {
            width: 60px;
            height: 60px;
            margin: 0 auto 14px;
            border-radius: 17px;

            display: flex;
            align-items: center;
            justify-content: center;

            background: linear-gradient(
                135deg,
                #86b94f,
                #659638
            );

            box-shadow: 0 10px 28px rgba(0, 0, 0, 0.24);
        }

        .brand-icon svg {
            width: 30px;
            height: 30px;
            fill: none;
            stroke: white;
            stroke-width: 1.8;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .brand-title {
            font-size: 22px;
            font-weight: 750;
            letter-spacing: -0.4px;
        }

        .brand-subtitle {
            margin-top: 6px;
            font-size: 13px;
            color: #f0f5eb;
        }

        .card {
            background: rgba(255, 255, 255, 0.97);
            border: 1px solid rgba(255, 255, 255, 0.75);
            border-radius: 19px;
            padding: 38px 32px;
            text-align: center;

            box-shadow:
                0 22px 60px rgba(0, 0, 0, 0.26),
                inset 0 1px 0 rgba(255, 255, 255, 0.8);

            backdrop-filter: blur(12px);
            animation: aparecer 0.4s ease-out;
        }

        .success-icon {
            width: 74px;
            height: 74px;
            margin: 0 auto 24px;
            border-radius: 50%;

            display: flex;
            align-items: center;
            justify-content: center;

            background: rgba(120, 169, 67, 0.12);
            border: 1px solid rgba(120, 169, 67, 0.30);
        }

        .success-icon svg {
            width: 37px;
            height: 37px;
            fill: none;
            stroke: var(--verde-oscuro);
            stroke-width: 2.2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .card h1 {
            font-size: 25px;
            font-weight: 750;
            letter-spacing: -0.5px;
            margin-bottom: 12px;
            color: #2c3b25;
        }

        .description {
            color: var(--texto-secundario);
            font-size: 14px;
            line-height: 1.7;
            margin-bottom: 28px;
        }

        .login-button {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            min-height: 48px;
            padding: 12px 16px;
            border-radius: 10px;

            background: linear-gradient(
                135deg,
                #78A943,
                #659638
            );

            color: white;
            text-decoration: none;
            font-size: 14px;
            font-weight: 700;

            box-shadow: 0 8px 20px rgba(93, 135, 50, 0.23);

            transition:
                transform 0.15s ease,
                box-shadow 0.15s ease,
                filter 0.15s ease;
        }

        .login-button:hover {
            filter: brightness(1.05);
            transform: translateY(-1px);
            box-shadow: 0 12px 26px rgba(93, 135, 50, 0.32);
            color: white;
        }

        .login-button:focus-visible {
            outline: 3px solid rgba(120, 169, 67, 0.4);
            outline-offset: 3px;
        }

        .footer {
            text-align: center;
            margin-top: 22px;
            font-size: 11px;
            color: #f0f5eb;
            text-shadow: 0 1px 5px rgba(0, 0, 0, 0.35);
        }

        @keyframes aparecer {
            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @media (max-width: 480px) {
            body {
                padding: 18px 14px;
                background-attachment: scroll;
            }

            .card {
                padding: 30px 22px;
            }

            .card h1 {
                font-size: 22px;
            }

            .brand-title {
                font-size: 20px;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            *,
            *::before,
            *::after {
                animation-duration: 0.01ms !important;
                transition-duration: 0.01ms !important;
            }
        }
    </style>
</head>

<body>

<div class="page">

    <header class="brand">
        <div class="brand-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24">
                <path d="M7 10V7a5 5 0 0 1 10 0v3"/>
                <rect x="4" y="10" width="16" height="11" rx="2"/>
                <path d="M12 14v3"/>
            </svg>
        </div>

        <div class="brand-title">
            Empaque Triple
        </div>

        <div class="brand-subtitle">
            Sistema de gestión y control de empaque de manzana
        </div>
    </header>

    <main class="card">

        <div class="success-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24">
                <path d="M5 12.5l4 4L19 7"/>
            </svg>
        </div>

        <h1>Contraseña actualizada</h1>

        <p class="description">
            Tu contraseña se cambió correctamente.
            Ya puedes iniciar sesión utilizando tu nueva contraseña.
        </p>

        <a href="/login/" class="login-button">
            Iniciar sesión
        </a>

    </main>

    <footer class="footer">
        Empaque Triple · Acceso seguro
    </footer>

</div>

</body>
</html>
