{% load staticfiles %}
<!doctype html>
<html class="no-js" lang="es">
    <head>
        <meta charset="utf-8">
        <meta http-equiv="x-ua-compatible" content="ie=edge">
        <title>Inicio de Sesión</title>
        <meta name="description" content=" de Invenarios">
        <meta name="viewport" content="width=device-width, initial-scale=1">

        {% include 'stylesheets.html' %}

        <style>
            body, html {
                height: 100%;
            }

            .card-container.card {
                max-width: 400px;
                padding: 40px 40px;
            }

            .btn {
                font-weight: 700;
                height: 36px;
                -moz-user-select: none;
                -webkit-user-select: none;
                user-select: none;
                cursor: default;
            }

            /*
             * Card component
             */
            .card {
                background-color: #F7F7F7;
                /* just in case there no content*/
                padding: 20px 25px 30px;
                margin: 0 auto 25px;
                margin-top: 50px;
                /* shadows and rounded borders */
                -moz-border-radius: 2px;
                -webkit-border-radius: 2px;
                border-radius: 2px;
                -moz-box-shadow: 0px 2px 2px rgba(0, 0, 0, 0.3);
                -webkit-box-shadow: 0px 2px 2px rgba(0, 0, 0, 0.3);
                box-shadow: 0px 2px 2px rgba(0, 0, 0, 0.3);
            }

            .profile-img-card {
                margin: 0 auto 10px;
                display: block;
                -moz-border-radius: 50%;
                -webkit-border-radius: 50%;
                border-radius: 50%;
            }

            /*
             * Form styles
             */
            .profile-name-card {
                font-size: 16px;
                font-weight: bold;
                text-align: center;
                margin: 10px 0 0;
                min-height: 1em;
            }

            .form-signin .form-control:focus {
                border-color: rgb(104, 145, 162);
                outline: 0;
                -webkit-box-shadow: inset 0 1px 1px rgba(0,0,0,.075),0 0 8px rgb(104, 145, 162);
                box-shadow: inset 0 1px 1px rgba(0,0,0,.075),0 0 8px rgb(104, 145, 162);
            }

            .btn.btn-signin {
                background-color: rgb(41, 86, 143);
                padding: 0px;
                font-weight: 700;
                font-size: 14px;
                height: 36px;
                -moz-border-radius: 3px;
                -webkit-border-radius: 3px;
                border-radius: 3px;
                border: none;
                -o-transition: all 0.218s;
                -moz-transition: all 0.218s;
                -webkit-transition: all 0.218s;
                transition: all 0.218s;
            }

            .btn.btn-signin:hover,
            .btn.btn-signin:active,
            .btn.btn-signin:focus {
                background-color: rgb(48, 129, 238);
            }
        </style>

    </head>
    <body>
        <!--[if lte IE 9]>
            <p class="browserupgrade">You are using an <strong>outdated</strong> browser. Please <a href="http://browsehappy.com/">upgrade your browser</a> to improve your experience and security.</p>
        <![endif]-->    

        
        <div class="container">
            <div class="card card-container">
                <p id="profile-name" class="profile-name-card">Sistema de <br> Inventarios</p><br>
                <form class="form-signin" method="POST" action="">
                    {% csrf_token %}

                    {% if error %}
                        <div class="alert alert-danger">{{ message }}</div>
                    {% endif %}

                    <div class="form-group">
                        <label for="login__email">Email</label>
                        <input type="text" class="form-control" id="login__email" name="email" placeholder="ej. nombre@ejemplo.com" />
                    </div>

                    <div class="form-group">
                        <label for="login__password">Password</label>
                        <input type="password" class="form-control" id="login__password" name="password" placeholder="ej. Contraseña" />
                    </div>

                    <input type="hidden" name="next" value="{{ next }}" />

                    <button class="btn btn-primary btn-block btn-signin" type="submit">Iniciar sesión</button>

                </form><!-- /form -->
                <p class="mb-1">
                    <a href="/accounts/password_reset/">Olvidé mi contraseña</a>
                </p>
            </div><!-- /card-container -->
        </div><!-- /container -->
        
        {% include 'javascripts.html' %}
    </body>
</html>
