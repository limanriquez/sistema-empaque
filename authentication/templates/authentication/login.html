{% load staticfiles %}
<!doctype html>
<html class="no-js" lang="es">
    <head>
        <meta charset="utf-8">
        <meta http-equiv="x-ua-compatible" content="ie=edge">
        <title>Recuperar Contraseña</title>
        <meta name="description" content="Sistema de inventarios">
        <meta name="viewport" content="width=device-width, initial-scale=1">

        {% include 'stylesheets.html' %}

        <style>
            body, html {
                height: 100%;
            }

            .card-container.card {
                max-width: 400px;
                padding: 40px 40px;
            }

            .btn {
                font-weight: 700;
                height: 36px;
                -moz-user-select: none;
                -webkit-user-select: none;
                user-select: none;
                cursor: default;
            }

            .card {
                background-color: #F7F7F7;
                padding: 20px 25px 30px;
                margin: 0 auto 25px;
                margin-top: 50px;
                border-radius: 2px;
                box-shadow: 0px 2px 2px rgba(0, 0, 0, 0.3);
            }

            .profile-name-card {
                font-size: 16px;
                font-weight: bold;
                text-align: center;
                margin: 10px 0 0;
                min-height: 1em;
            }

            .form-signin .form-control:focus {
                border-color: rgb(104, 145, 162);
                outline: 0;
                -webkit-box-shadow: inset 0 1px 1px rgba(0,0,0,.075),0 0 8px rgb(104, 145, 162);
                box-shadow: inset 0 1px 1px rgba(0,0,0,.075),0 0 8px rgb(104, 145, 162);
            }

            .btn.btn-signin {
                background-color: rgb(41, 86, 143);
                padding: 0px;
                font-weight: 700;
                font-size: 14px;
                height: 36px;
                border-radius: 3px;
                border: none;
                transition: all 0.218s;
            }

            .btn.btn-signin:hover,
            .btn.btn-signin:active,
            .btn.btn-signin:focus {
                background-color: rgb(48, 129, 238);
            }

            .messages {
                margin-top: 20px;
                list-style-type: none;
                padding: 0;
            }

            .message {
                color: red;
                font-size: 14px;
                text-align: center;
            }

            .alert.alert-danger {
                color: #721c24;
                background-color: #f8d7da;
                border-color: #f5c6cb;
                padding: 10px;
                border-radius: 5px;
                margin-top: 10px;
            }
        </style>

    </head>
    <body>
        <!--[if lte IE 9]>
            <p class="browserupgrade">You are using an <strong>outdated</strong> browser. Please <a href="http://browsehappy.com/">upgrade your browser</a> to improve your experience and security.</p>
        <![endif]-->    

        <div class="container">
            <div class="card card-container">
                <p id="profile-name" class="profile-name-card">Recupera tu contraseña</p><br>
                <form class="form-signin" method="POST" action="">
                    {% csrf_token %}

                    {% if messages %}
                        <ul class="messages">
                            {% for message in messages %}
                                <li class="message">{{ message }}</li>
                            {% endfor %}
                        </ul>
                    {% endif %}

                    <div class="form-group">
                        <label for="login__email">Correo electrónico</label>
                        {{ form.email }}
                    </div>

                    <button class="btn btn-primary btn-block btn-signin" type="submit">Enviar enlace de restablecimiento</button>

                </form><!-- /form -->

                <p class="mb-1">
                    <a href="/accounts/login/">Volver al inicio de sesión</a>
                </p>
            </div><!-- /card-container -->
        </div><!-- /container -->

        {% include 'javascripts.html' %}
    </body>
</html>
