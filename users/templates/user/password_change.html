{% load staticfiles %}
<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta http-equiv="x-ua-compatible" content="ie=edge">
    <title>Cambiar Contraseña</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    {% include 'stylesheets.html' %}
    <style>
        body, html {
            height: 100%;
            background-color: #eef9f8; /* Fondo claro */
        }

        .card {
            border: none;
            border-radius: 1.5rem; /* Esquinas uniformemente redondeadas */
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2); /* Sombra inicial */
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .card:hover {
            transform: translateY(-5px); /* Movimiento vertical reducido */
            box-shadow: 0 6px 12px rgba(0, 0, 0, 0.3); /* Sombra menos intensa */
        }

        .card-header {
            background-color: #4682b4; /* Azul medio */
            color: white;
            font-size: 1.8rem;
            font-weight: bold;
            text-align: center;
            border-radius: 1.5rem 1.5rem 0 0; /* Esquinas superiores redondeadas */
        }

        .btn-primary {
            background-color: #4682b4; /* Azul medio */
            border-color: #3a6d99;
        }

        .btn-primary:hover {
            background-color: #3a6d99; /* Azul más oscuro al pasar el mouse */
            border-color: #2e5879;
        }

        .container-centered {
            height: 100%; 
            display: flex; 
            align-items: flex-start; /* Alinear más arriba */
            justify-content: center; 
            padding-top: 5rem; /* Ajustar altura superior */
        }

        .form-label {
            font-weight: bold;
        }

        .alert-danger {
            background-color: #f8d7da;
            color: #842029;
        }
    </style>
</head>
<body>
    <div class="container-centered">
        <div class="card" style="width: 32rem;">
            <div class="card-header">
                Cambiar Contraseña
            </div>
            <div class="card-body">
                <form method="post">
                    {% csrf_token %}
                    
                    {% if error %}
                        <div class="alert alert-danger">{{ message }}</div>
                    {% endif %}

                    <div class="mb-3">
                        <label for="id_old_password" class="form-label">Contraseña Actual</label>
                        <input type="password" class="form-control" id="id_old_password" name="old_password" placeholder="Contraseña Actual" required />
                    </div>

                    <div class="mb-3">
                        <label for="id_new_password1" class="form-label">Nueva Contraseña</label>
                        <input type="password" class="form-control" id="id_new_password1" name="new_password1" placeholder="Nueva Contraseña" required />
                    </div>

                    <div class="mb-3">
                        <label for="id_new_password2" class="form-label">Confirmar Nueva Contraseña</label>
                        <input type="password" class="form-control" id="id_new_password2" name="new_password2" placeholder="Confirmar Nueva Contraseña" required />
                    </div>

                    <button class="btn btn-primary w-100" type="submit">Cambiar Contraseña</button>
                </form>
                <div class="text-center mt-3">
                    <a href="{% url 'home' %}" class="text-decoration-none">Cancelar</a>
                </div>
            </div>
        </div>
    </div>
    {% include 'javascripts.html' %}
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
